name: Publish Web Preview

on:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: credit-card-crm-web-preview
          path: web/
          if-no-files-found: error
